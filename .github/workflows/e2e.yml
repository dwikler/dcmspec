name: e2e

on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (live DICOM standard canary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Poetry
        uses: pronovic/setup-poetry@v2
        with:
          version: "2.1.1"
          cache-venv: "true"
          cache-poetry: "true"

      - name: Install dependencies
        shell: bash
        run: |
          poetry install --with dev
          poetry run pip install ".[gui,pdf]"

      - name: Run e2e tests
        shell: bash
        run: poetry run python -m pytest -v tests/e2e
